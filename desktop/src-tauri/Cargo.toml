[package]
name = "decisionos"
version = "0.1.0"
description = "DecisionOS desktop shell"
edition = "2021"
# Tauri v2 + the crates below need a reasonably recent stable Rust —
# see DESKTOP.md for the exact minimum and why this sandbox couldn't
# verify the build itself (Ubuntu's apt-packaged rustc is too old, and
# rustup's own servers aren't reachable from here).
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS-native secret storage: Windows Credential Manager, macOS Keychain,
# Linux Secret Service (gnome-keyring/kwallet via the `secret-service`
# backend). This is what "Configurar secure storage" in the roadmap
# means here — the JWT signing secret, the DB-connector config
# encryption key, and the user's own Anthropic API key are never
# written to a plaintext file.
keyring = { version = "3", features = ["sync-secret-service"] }
rand = "0.8"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
