name: CI

# Runs on every push/PR — unlike desktop-build.yml (manual/tag-only), this
# is the workflow that actually protects main: it's what would have caught
# the pre-P0 bugs (undefined nav components, the fabricated simulator
# range) at PR time instead of by hand later. See STATUS.md items #1 and
# #3 from the review: this file exists so "npm test passes" is enforced,
# not just something a human remembers to run locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (test + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-audit --no-fund

      # vitest mocks the pg pool (see test/setupEnv.js) — no real Postgres
      # needed here. That's deliberate: this job stays fast enough to run
      # on every push. The E2E job (e2e.yml) is where a real DB shows up.
      - run: npm test

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  repo-hygiene:
    name: No committed build artifacts / binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders on top of .gitignore: fail the build if any of
      # the desktop/backend/frontend build output directories somehow made
      # it into a commit (e.g. someone force-added a file, or .gitignore
      # regresses). These paths should never exist in a checked-out tree
      # that came straight from git — .gitignore keeps them out of new
      # commits, this check catches it if that ever fails.
      - name: Check for known build-artifact directories
        run: |
          set -e
          offenders=""
          for d in \
            "desktop/src-tauri/target" \
            "desktop/src-tauri/resources" \
            "desktop/src-tauri/binaries" \
            "desktop/.backend-staging" \
            "backend/dist" \
            "frontend/dist" \
            "**/node_modules"; do
            matches=$(git ls-files | grep -E "^${d//\*\*/[^/]+}/" || true)
            if [ -n "$matches" ]; then
              offenders="$offenders\n[$d]\n$matches"
            fi
          done
          if [ -n "$offenders" ]; then
            echo "::error::Build artifacts or binaries are tracked in git:"
            echo -e "$offenders"
            exit 1
          fi
          echo "No known build-artifact directories are tracked. OK."

      # Second, independent check: flag any tracked file that looks like a
      # compiled binary (by extension) or is suspiciously large. Binaries
      # from a Tauri build or a staged node_modules are usually >1MB;
      # source, config, and docs in this repo never are.
      - name: Check for tracked binaries / oversized files
        run: |
          set -e
          bad_ext='\.(exe|dll|dylib|so|node|a|lib|msi|dmg|app|deb|AppImage|nsis)$'
          found_ext=$(git ls-files | grep -E "$bad_ext" || true)
          if [ -n "$found_ext" ]; then
            echo "::error::Tracked files with binary-looking extensions:"
            echo "$found_ext"
            exit 1
          fi

          # Anything over 1MB in this repo is almost certainly not meant
          # to be committed (real source files here are all small).
          too_big=""
          while IFS= read -r f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 1048576 ]; then
              too_big="$too_big\n$f ($size bytes)"
            fi
          done < <(git ls-files)
          if [ -n "$too_big" ]; then
            echo "::error::Tracked files over 1MB (likely build artifacts):"
            echo -e "$too_big"
            exit 1
          fi
          echo "No oversized or binary-looking tracked files. OK."
