name: E2E (full flow)

# Separate from ci.yml on purpose (see frontend/e2e/README.md: "wire it
# into your CI as a separate, slower job... rather than blocking every
# commit on it"). This runs the real Playwright flow — register, import,
# data quality, analytics, decision, Ask Advisor, simulation — against a
# real Postgres and a real backend process, not mocks.
#
# The "Ask Advisor" step makes a genuine call to the Anthropic API, so
# this job needs an ANTHROPIC_API_KEY repo/environment secret. If that
# secret isn't set (e.g. on a fork), the job is skipped instead of
# failing red — add ANTHROPIC_API_KEY under Settings -> Secrets and
# variables -> Actions to enable it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, in addition to on-push — catches drift even on days with
    # no commits (e.g. a dependency update breaking the flow).
    - cron: "0 3 * * *"

jobs:
  e2e:
    name: Full flow (Postgres + backend + frontend + Playwright)
    runs-on: ubuntu-latest
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decisionos
          POSTGRES_PASSWORD: decisionos
          POSTGRES_DB: decisionos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://decisionos:decisionos@localhost:5432/decisionos
      PGSSL: disable
      JWT_SECRET: e2e-ci-secret-not-for-production-0123456789
      CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PORT: 8787
      VITE_DECISIONOS_API_BASE: http://localhost:8787
      E2E_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run migrations
        working-directory: backend
        run: npm run migrate

      - name: Start backend
        working-directory: backend
        run: |
          nohup npm start > backend.log 2>&1 &
          echo "Waiting for backend to come up on :8787..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/health >/dev/null 2>&1; then
              echo "Backend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not come up in time — dumping logs:"
          cat backend.log
          exit 1

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend (dev server)
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 > frontend.log 2>&1 &
          echo "Waiting for frontend to come up on :5173..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 >/dev/null 2>&1; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not come up in time — dumping logs:"
          cat frontend.log
          exit 1

      - name: Run Playwright E2E suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Dump backend log on failure
        if: failure()
        run: cat backend/backend.log || true
