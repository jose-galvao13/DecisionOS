name: Desktop build (FASE 11)

# Builds real installers on GitHub's own native Windows/macOS/Linux
# runners — the actual way this gets built, sandbox or not, since a
# genuine .exe needs a Windows toolchain and a genuine .dmg needs a
# macOS one. See desktop/DESKTOP.md for how to run the equivalent
# steps locally on your own machine instead.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest # arm64 (Apple Silicon) runner
            bundle: dmg
          - os: ubuntu-22.04 # pinned (not ubuntu-latest) for webkit2gtk-4.1 availability
            bundle: appimage deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux system dependencies (Tauri v2 / webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev

      - name: Install Linux keychain backend (Secret Service, for `keyring` crate)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gnome-keyring libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies (needed to prepare sidecar resources)
        run: npm ci
        working-directory: backend

      - name: Install desktop (Tauri CLI) dependencies
        run: npm ci
        working-directory: desktop

      - name: Prepare backend resources (production deps only)
        run: node scripts/prepare-backend-resources.mjs
        working-directory: desktop

      - name: Stage the runner's own Node.js as the Tauri sidecar
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p desktop/src-tauri/binaries
          NODE_BIN="$(command -v node)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$NODE_BIN" "desktop/src-tauri/binaries/node-${TRIPLE}.exe"
          else
            cp "$NODE_BIN" "desktop/src-tauri/binaries/node-${TRIPLE}"
            chmod +x "desktop/src-tauri/binaries/node-${TRIPLE}"
          fi
          echo "Staged sidecar for target triple: ${TRIPLE}"

      - name: Build the desktop app
        run: npx tauri build
        working-directory: desktop

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: decisionos-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
